<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lottery Control Panel</title>
<link rel="stylesheet" href="/panel/assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>

<!-- ------------------------------------------------------------- login -->
<div id="login" class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="brand"><span class="dot"></span> Lottery Control Panel</div>
    <p class="muted small">Sign in with the administrator credentials from your <code>.env</code>.</p>
    <label>User <input type="text" id="login-user" value="admin" autocomplete="username"></label>
    <label>Password <input type="password" id="login-pass" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Sign in</button>
    <div id="login-error" class="error"></div>
    <p class="muted small mt">Panel version <span id="login-version">—</span></p>
  </form>
</div>

<!-- --------------------------------------------------------------- app -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> <span>Lottery</span></div>
    <nav id="nav">
      <button data-view="dashboard" class="active"><i>◧</i> Dashboard</button>
      <button data-view="games"><i>◎</i> Live games</button>
      <button data-view="results"><i>≡</i> Results</button>
      <button data-view="bets"><i>₹</i> Bets</button>
      <button data-view="users"><i>☺</i> Users</button>
      <button data-view="ledger"><i>⇄</i> Ledger</button>
      <button data-view="plans"><i>⧉</i> Copy trading</button>
      <button data-view="vip"><i>★</i> VIP</button>
      <button data-view="audit"><i>⏱</i> Audit log</button>
      <button data-view="system"><i>⚙</i> System</button>
    </nav>
    <div class="sidebar-foot">
      <div id="worker-pill" class="pill">worker …</div>
      <button class="btn ghost small block" id="btn-worker">Run worker pass</button>
      <button class="btn ghost small block" id="btn-logout">Sign out</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <h1 id="view-title">Dashboard</h1>
      <div class="topbar-right">
        <span id="clock" class="muted small"></span>
        <button class="btn ghost small" id="btn-refresh">↻ Refresh</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<!-- ------------------------------------------------------------- modal -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modal-title">Title</h3><button class="btn ghost small" id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/panel/assets/app.js"></script>
</body>
</html>
