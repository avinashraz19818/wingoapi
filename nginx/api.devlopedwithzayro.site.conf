# ==============================================================================
# Nginx Virtual Host Configuration for: api.devlopedwithzayro.site
# Location on VPS: /etc/nginx/sites-available/api.devlopedwithzayro.site.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.devlopedwithzayro.site;

    root /var/www/wingoapi;
    index index.php index.html;

    access_log /var/log/nginx/wingo_api_access.log;
    error_log /var/log/nginx/wingo_api_error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle OPTIONS preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # REST Router / Friendly URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Block sensitive hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }
}
