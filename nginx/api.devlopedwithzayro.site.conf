# ==============================================================================
# Nginx Virtual Host Configuration for: api.devlopedwithzayro.site
# Location on VPS: /etc/nginx/sites-available/api.devlopedwithzayro.site.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.devlopedwithzayro.site;

    # Document Root (Change path if your repo is cloned in another directory)
    root /var/www/wingoapi;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/wingo_api_access.log;
    error_log /var/log/nginx/wingo_api_error.log;

    # Global CORS Headers for API
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle OPTIONS preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # REST Router / Friendly URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler (Checks standard sockets)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Adjust version if your VPS runs php8.1, php8.2, php8.3, or php8.4
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        # Alternative fallback:
        # fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Block sensitive hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }

    location ~ /(data|tests)/ {
        deny all;
    }
}
