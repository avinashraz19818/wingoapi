; /etc/php/8.3/fpm/pool.d/lottery.conf
[lottery]
user  = www-data
group = www-data
listen = /run/php/php8.3-fpm-lottery.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children      = 40
pm.start_servers     = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests      = 1000

php_admin_value[memory_limit]        = 192M
php_admin_value[max_execution_time]  = 30
php_admin_value[post_max_size]       = 1M
php_admin_value[upload_max_filesize] = 1M
php_admin_value[expose_php]          = Off
php_admin_value[display_errors]      = Off
php_admin_value[log_errors]          = On
php_admin_value[error_log]           = /var/log/php/lottery-fpm.log
php_admin_value[date.timezone]       = Asia/Kolkata
php_admin_value[opcache.enable]              = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.memory_consumption]  = 128
php_admin_value[opcache.max_accelerated_files] = 10000
