# ---------------------------------------------------------------------------
#  Apache 2.4 + PHP-FPM vhost for the Lottery SaaS API
#  /etc/apache2/sites-available/lottery-api.conf
#  Requires: a2enmod rewrite proxy_fcgi headers ssl
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName api.example.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.example.com
    DocumentRoot /var/www/lottery-api

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/api.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm-lottery.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/lottery-api>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Keep sources, config and data private.
    <DirectoryMatch "/var/www/lottery-api/(src|tests|tools|cron|deploy|docs|data)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(env|sqlite|log|md|sql)$">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/lottery-api.error.log
    CustomLog ${APACHE_LOG_DIR}/lottery-api.access.log combined
</VirtualHost>
