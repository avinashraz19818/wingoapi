# ---------------------------------------------------------------------------
#  Nginx + PHP-FPM vhost for the Lottery SaaS API
#  /etc/nginx/sites-available/lottery-api.conf
# ---------------------------------------------------------------------------

# Rate limiting at the edge (the app also enforces 120 req/min per IP).
limit_req_zone $binary_remote_addr zone=lottery_api:10m rate=4r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # ACME renewals, everything else goes to HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    root /var/www/lottery-api;
    index index.php;

    # ------------------------------------------------------------------ TLS
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;
    keepalive_timeout 30s;

    access_log /var/log/nginx/lottery-api.access.log;
    error_log  /var/log/nginx/lottery-api.error.log warn;

    # Never serve dotfiles, config, sources, logs or the SQLite dev database.
    location ~ /\.                     { deny all; }
    location ~* ^/(src|tests|tools|cron|deploy|docs|data)/ { deny all; }

    # Admin panel assets (the SPA shell itself is rendered by index.php at /admin).
    # Tip: uncomment the allow/deny lines to restrict the panel to your office IPs.
    location ^~ /panel/assets/ {
        # allow 203.0.113.0/24; deny all;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }
    location ~* \.(sqlite|log|md|sql|env)$ { deny all; }

    # Everything is routed through the single front controller.
    location = /admin {
        # allow 203.0.113.0/24; deny all;   # optional IP allowlist for the panel
        limit_req zone=lottery_api burst=20 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        limit_req zone=lottery_api burst=40 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-lottery.sock;
        fastcgi_read_timeout 30s;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Block direct execution of any other PHP file.
    location ~ \.php$ { return 404; }
}
